services:
  - type: web
    name: avatar-backend
    runtime: node
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
